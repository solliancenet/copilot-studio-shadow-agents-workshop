mcs.metadata:
  componentName: Get risk score
  description: Scores a risk profile via the underwriting MCP server.
kind: AdaptiveDialog
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    displayName: Get risk score
    triggerQueries:
      - get a risk score
      - score this risk
      - risk score

  actions:
    - kind: Question
      id: ask-profile
      alwaysPrompt: true
      variable: init:Topic.profile
      prompt: What's the risk profile?
      entity: StringPrebuiltEntity

    - kind: InvokeMcpTool
      id: mcp-score
      serverLabel: Underwriting
      serverUrl: ${UNDERWRITING_MCP_FQDN}/underwriting
      toolName: get_risk_score
      headers:
        Authorization: Bearer ${MCP_BEARER}
      arguments:
        profile: =Topic.profile
      output:
        autoSend: false
        result: init:Topic.scoreResult

    - kind: SendActivity
      id: reply
      activity: "Risk score: {Topic.scoreResult}"
