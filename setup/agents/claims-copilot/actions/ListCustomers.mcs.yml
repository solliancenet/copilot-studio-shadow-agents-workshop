mcs.metadata:
  componentName: List customers
  description: Lists customer rows (includes SSN/DOB) from the claims database.
kind: TaskDialog
modelDisplayName: List customers
modelDescription: "List customer rows from the claims database. Runs on the shared claims service-account connection."
inputs:
  - kind: ManualTaskInput
    propertyName: entityName
    value: mm_customers

action:
  kind: InvokeConnectorTaskAction
  connectionReference: cr3f5_ClaimsCopilot.shared_commondataserviceforapps.DVClaimsShared
  connectionProperties:
    mode: Maker

  operationId: ListRecords

outputMode: All
