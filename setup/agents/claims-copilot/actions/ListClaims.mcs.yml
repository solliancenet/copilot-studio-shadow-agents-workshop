mcs.metadata:
  componentName: List claims
  description: Lists claim rows from the claims database.
kind: TaskDialog
modelDisplayName: List claims
modelDescription: "List claim rows from the claims database. Runs on the shared claims service-account connection."
inputs:
  # "List rows from selected environment". The current-environment op (ListRecords) returns HTTP 400 from a
  # Copilot Studio tool - there is no environment context to resolve - so name the environment explicitly.
  - kind: ManualTaskInput
    propertyName: organization
    value: ${ENV_ORG_URL}

  - kind: ManualTaskInput
    propertyName: entityName
    value: mm_claims

action:
  kind: InvokeConnectorTaskAction
  connectionReference: cr3f5_ClaimsCopilot.shared_commondataserviceforapps.DVClaimsShared
  connectionProperties:
    mode: Maker

  operationId: ListRecordsWithOrganization

outputMode: All
