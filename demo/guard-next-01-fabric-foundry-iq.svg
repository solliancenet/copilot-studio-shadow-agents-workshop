<svg xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, system-ui, -apple-system, Arial, sans-serif" viewBox="0 0 1280 720"><defs><marker id="arr" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#64748b" d="M0,0 L10,5 L0,10 z"/></marker><marker id="arru" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#0d7a5f" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect width="1280" height="720" fill="#f7f9fc"/><text x="40" y="66" fill="#0f172a" font-size="26" font-weight="700">Foundry IQ + Fabric IQ — agents ground on governed data products</text><text x="40" y="92" fill="#475569" font-size="15">Data Mesh domains publish governed data products; every agent grounds on the same source — consistency by design.</text><rect width="520" height="392" x="40" y="120" fill="#fff" stroke="#cbd5e1" stroke-width="1.5" rx="14"/><rect width="520" height="40" x="40" y="120" fill="#fff7ed" rx="14"/><rect width="520" height="18" x="40" y="142" fill="#fff7ed"/><text x="60" y="146" fill="#b45309" font-size="13" font-weight="700">BEHIND THE DEMO TODAY</text><text x="60" y="194" fill="#0f172a" font-size="15" font-weight="700">One agent, hand-wired grounding</text><rect width="480" height="54" x="60" y="210" fill="#f2fbf8" stroke="#5ec5a8" rx="9"/><text x="78" y="235" fill="#0f766e" font-size="13.5" font-weight="700">File Search grounding</text><text x="78" y="254" fill="#475569" font-size="12">claim declarations · claims-handling guide (curated docs)</text><rect width="480" height="54" x="60" y="274" fill="#f2fbf8" stroke="#5ec5a8" rx="9"/><text x="78" y="299" fill="#0f766e" font-size="13.5" font-weight="700">Claims &amp; Policy API</text><text x="78" y="318" fill="#475569" font-size="12">reads live claim / policy data via OpenAPI tool</text><text x="60" y="358" fill="#64748b" font-size="12.5" font-style="italic">Grounded and cited — but knowledge is wired per-agent.</text><rect width="480" height="116" x="60" y="378" fill="#eef2f7" stroke="#94a3b8" rx="10"/><text x="78" y="404" fill="#334155" font-size="13" font-weight="700">The scaling question</text><text x="78" y="429" fill="#475569" font-size="12.5">6–8 domains × many engineering-role agents, each</text><text x="78" y="448" fill="#475569" font-size="12.5">grounding itself, is how you get drift, duplicated logic,</text><text x="78" y="467" fill="#475569" font-size="12.5">and inconsistent answers across the estate.</text><line x1="566" x2="646" y1="316" y2="316" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/><text x="606" y="305" fill="#64748b" font-size="11" text-anchor="middle">scale</text><rect width="588" height="392" x="652" y="120" fill="#fff" stroke="#2563eb" stroke-width="2" rx="14"/><rect width="588" height="40" x="652" y="120" fill="#eff4ff" rx="14"/><rect width="588" height="18" x="652" y="142" fill="#eff4ff"/><text x="672" y="146" fill="#1d4ed8" font-size="13" font-weight="700">GROUND EVERY AGENT ON THE SAME GOVERNED DATA PRODUCTS</text><rect width="548" height="46" x="672" y="176" fill="#fffbeb" stroke="#e5c37a" rx="9"/><text x="690" y="197" fill="#92610a" font-size="13.5" font-weight="700">Data domains — 6–8 Data Mesh domains</text><text x="690" y="214" fill="#7c5a12" font-size="11.5">decide what data becomes a product</text><line x1="946" x2="946" y1="222" y2="234" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/><text x="962" y="232" fill="#64748b" font-size="10.5">publish</text><rect width="548" height="112" x="672" y="236" fill="#e6f7f1" stroke="#5ec5a8" rx="10"/><text x="690" y="262" fill="#0d7a5f" font-size="15" font-weight="700">Microsoft Fabric — governed Data products</text><rect width="230" height="30" x="690" y="274" fill="#0d7a5f" rx="7"/><text x="805" y="294" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">Fabric IQ</text><text x="936" y="294" fill="#334155" font-size="12">semantic models · business concepts</text><text x="690" y="328" fill="#475569" font-size="12">certified data products · lineage — one governed source of truth</text><line x1="946" x2="946" y1="348" y2="366" stroke="#0d7a5f" stroke-width="2.5" marker-end="url(#arru)"/><text x="962" y="361" fill="#0d7a5f" font-size="10.5" font-weight="700">ground on data products</text><rect width="548" height="126" x="672" y="368" fill="#f6f9ff" stroke="#2563eb" rx="10"/><text x="690" y="394" fill="#1d4ed8" font-size="15" font-weight="700">Microsoft Foundry agents</text><rect width="230" height="30" x="690" y="406" fill="#1d4ed8" rx="7"/><text x="805" y="426" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">Foundry IQ</text><text x="936" y="426" fill="#334155" font-size="12">agents ground here — consistently</text><text x="690" y="462" fill="#64748b" font-size="11.5">The same data products also ground Copilot Studio &amp; M365 Copilot (Work IQ)</text><text x="690" y="480" fill="#64748b" font-size="11.5">— one source, many surfaces.</text><rect width="1200" height="120" x="40" y="536" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.5" rx="12"/><text x="58" y="560" fill="#334155" font-size="13" font-weight="700">WHY IT MATTERS</text><rect width="360" height="66" x="58" y="572" fill="#fff" stroke="#cbd5e1" rx="9"/><text x="74" y="597" fill="#0d7a5f" font-size="13" font-weight="700">Consistency &amp; quality</text><text x="74" y="618" fill="#475569" font-size="11.5">every agent answers from the same governed</text><text x="74" y="633" fill="#475569" font-size="11.5">data — no drift across domains</text><rect width="360" height="66" x="430" y="572" fill="#fff" stroke="#cbd5e1" rx="9"/><text x="446" y="597" fill="#1d4ed8" font-size="13" font-weight="700">Governed execution on Fabric</text><text x="446" y="618" fill="#475569" font-size="11.5">agents act on certified data products,</text><text x="446" y="633" fill="#475569" font-size="11.5">not raw tables</text><rect width="422" height="66" x="802" y="572" fill="#fff" stroke="#cbd5e1" rx="9"/><text x="818" y="597" fill="#6d28d9" font-size="13" font-weight="700">Scoped by the platform</text><text x="818" y="618" fill="#475569" font-size="11.5">what an agent can reason over is set by the</text><text x="818" y="633" fill="#475569" font-size="11.5">governed layer, not the agent author</text></svg>