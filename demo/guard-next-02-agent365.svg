<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Segoe UI, system-ui, -apple-system, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#f7f9fc"/>

  <!-- Title -->
  <text x="40" y="66" font-size="26" font-weight="700" fill="#0f172a">Microsoft Agent 365 — control all agents</text>
  <text x="40" y="92" font-size="15" fill="#475569">The control plane over the whole agent fleet: identity, least privilege, lifecycle, and monitoring.</text>

  <!-- Org-wide governance quartet strip -->
  <rect x="40" y="110" width="1200" height="52" rx="10" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="58" y="131" font-size="10.5" font-weight="700" fill="#64748b">ORG-WIDE</text>
  <text x="58" y="146" font-size="10.5" font-weight="700" fill="#64748b">GOVERNANCE</text>
  <rect x="196" y="122" width="120" height="28" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="256" y="141" text-anchor="middle" font-size="12.5" fill="#475569">Entra</text>
  <rect x="326" y="122" width="150" height="28" rx="14" fill="#1e40af" stroke="#1e40af"/>
  <text x="401" y="141" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">Agent 365</text>
  <rect x="486" y="122" width="120" height="28" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="546" y="141" text-anchor="middle" font-size="12.5" fill="#475569">Purview</text>
  <rect x="616" y="122" width="120" height="28" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="676" y="141" text-anchor="middle" font-size="12.5" fill="#475569">Defender</text>
  <text x="1222" y="140" text-anchor="end" font-size="12" fill="#334155" font-style="italic">Governance &amp; security for the entire organization</text>

  <!-- LEFT: Behind the demo today -->
  <rect x="40" y="176" width="470" height="336" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="40" y="176" width="470" height="38" rx="14" fill="#fff7ed"/>
  <rect x="40" y="197" width="470" height="17" fill="#fff7ed"/>
  <text x="60" y="200" font-size="13" font-weight="700" fill="#b45309">BEHIND THE DEMO TODAY</text>

  <text x="60" y="244" font-size="15" font-weight="700" fill="#0f172a">One agent, done right</text>
  <rect x="60" y="258" width="430" height="52" rx="9" fill="#f6f9ff" stroke="#93b4f5"/>
  <text x="78" y="281" font-size="13" font-weight="700" fill="#1d4ed8">Its own identity</text>
  <text x="78" y="299" font-size="11.5" fill="#475569">Entra / managed identity — not a shared account</text>

  <rect x="60" y="318" width="430" height="52" rx="9" fill="#f6f9ff" stroke="#93b4f5"/>
  <text x="78" y="341" font-size="13" font-weight="700" fill="#1d4ed8">Least-privilege reach</text>
  <text x="78" y="359" font-size="11.5" fill="#475569">scoped read to exactly the data it needs</text>

  <rect x="60" y="378" width="430" height="52" rx="9" fill="#f6f9ff" stroke="#93b4f5"/>
  <text x="78" y="401" font-size="13" font-weight="700" fill="#1d4ed8">Human-in-the-loop</text>
  <text x="78" y="419" font-size="11.5" fill="#475569">the agent briefs; the adjuster decides</text>

  <rect x="60" y="440" width="430" height="60" rx="10" fill="#eef2f7" stroke="#94a3b8"/>
  <text x="78" y="465" font-size="12.5" font-weight="700" fill="#334155">The scaling question</text>
  <text x="78" y="486" font-size="12" fill="#475569">Doing that for a fleet across 6–8 domains needs a control plane.</text>

  <!-- arrow -->
  <line x1="516" y1="344" x2="556" y2="344" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="536" y="333" text-anchor="middle" font-size="11" fill="#64748b">scale</text>

  <!-- RIGHT: What comes next -->
  <rect x="562" y="176" width="678" height="336" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="562" y="176" width="678" height="38" rx="14" fill="#eff4ff"/>
  <rect x="562" y="197" width="678" height="17" fill="#eff4ff"/>
  <text x="582" y="200" font-size="13" font-weight="700" fill="#1d4ed8">ONE CONTROL PLANE FOR EVERY AGENT</text>

  <g>
    <rect x="582" y="226" width="316" height="84" rx="10" fill="#f6f9ff" stroke="#93b4f5"/>
    <text x="600" y="252" font-size="14" font-weight="700" fill="#1d4ed8">Registry / inventory</text>
    <text x="600" y="274" font-size="11.5" fill="#475569">every agent known — no shadow</text>
    <text x="600" y="292" font-size="11.5" fill="#475569">agents; one view of the fleet</text>

    <rect x="910" y="226" width="316" height="84" rx="10" fill="#f6f9ff" stroke="#93b4f5"/>
    <text x="928" y="252" font-size="14" font-weight="700" fill="#1d4ed8">Entra Agent ID</text>
    <text x="928" y="274" font-size="11.5" fill="#475569">each agent a first-class identity —</text>
    <text x="928" y="292" font-size="11.5" fill="#475569">whose authority is it acting on?</text>

    <rect x="582" y="320" width="316" height="84" rx="10" fill="#f6f9ff" stroke="#93b4f5"/>
    <text x="600" y="346" font-size="14" font-weight="700" fill="#1d4ed8">Least privilege &amp; access</text>
    <text x="600" y="368" font-size="11.5" fill="#475569">scoped effective reach enforced</text>
    <text x="600" y="386" font-size="11.5" fill="#475569">centrally, per agent</text>

    <rect x="910" y="320" width="316" height="84" rx="10" fill="#f6f9ff" stroke="#93b4f5"/>
    <text x="928" y="346" font-size="14" font-weight="700" fill="#1d4ed8">Lifecycle</text>
    <text x="928" y="368" font-size="11.5" fill="#475569">onboard → certify → retire; kill</text>
    <text x="928" y="386" font-size="11.5" fill="#475569">orphaned / stale agents</text>

    <rect x="582" y="414" width="316" height="84" rx="10" fill="#f6f9ff" stroke="#93b4f5"/>
    <text x="600" y="440" font-size="14" font-weight="700" fill="#1d4ed8">Monitoring &amp; posture</text>
    <text x="600" y="462" font-size="11.5" fill="#475569">what is each agent doing, and is</text>
    <text x="600" y="480" font-size="11.5" fill="#475569">it still behaving as approved?</text>

    <rect x="910" y="414" width="316" height="84" rx="10" fill="#fff7ed" stroke="#d97706"/>
    <text x="928" y="440" font-size="14" font-weight="700" fill="#b45309">Policy &amp; approval gates</text>
    <text x="928" y="462" font-size="11.5" fill="#475569">human-in-the-loop enforced as a</text>
    <text x="928" y="480" font-size="11.5" fill="#475569">fleet policy, not a per-build habit</text>
  </g>

  <!-- BOTTOM: why it matters -->
  <rect x="40" y="536" width="1200" height="120" rx="12" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="58" y="560" font-size="13" font-weight="700" fill="#334155">WHY IT MATTERS</text>

  <rect x="58" y="572" width="382" height="66" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="74" y="597" font-size="13" font-weight="700" fill="#1d4ed8">Governance that scales</text>
  <text x="74" y="618" font-size="11.5" fill="#475569">one control plane as the estate grows from</text>
  <text x="74" y="633" font-size="11.5" fill="#475569">a few agents to many across domains</text>

  <rect x="452" y="572" width="382" height="66" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="468" y="597" font-size="13" font-weight="700" fill="#0d7a5f">Identity you can attribute</text>
  <text x="468" y="618" font-size="11.5" fill="#475569">every agent is identified, scoped, and</text>
  <text x="468" y="633" font-size="11.5" fill="#475569">accountable for what it does</text>

  <rect x="846" y="572" width="378" height="66" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="862" y="597" font-size="13" font-weight="700" fill="#6d28d9">Enforced boundaries</text>
  <text x="862" y="618" font-size="11.5" fill="#475569">one fleet-level point to enforce identity,</text>
  <text x="862" y="633" font-size="11.5" fill="#475569">access, and policy</text>
</svg>
