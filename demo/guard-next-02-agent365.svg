<svg xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, system-ui, -apple-system, Arial, sans-serif" viewBox="0 0 1280 720"><defs><marker id="arr" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#64748b" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect width="1280" height="720" fill="#f7f9fc"/><text x="40" y="66" fill="#0f172a" font-size="26" font-weight="700">Microsoft Agent 365 — control all agents</text><text x="40" y="92" fill="#475569" font-size="15">The control plane over the whole agent fleet: identity, least privilege, lifecycle, and monitoring.</text><rect width="1200" height="52" x="40" y="110" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.5" rx="10"/><text x="58" y="131" fill="#64748b" font-size="10.5" font-weight="700">ORG-WIDE</text><text x="58" y="146" fill="#64748b" font-size="10.5" font-weight="700">GOVERNANCE</text><rect width="120" height="28" x="196" y="122" fill="#fff" stroke="#cbd5e1" rx="14"/><text x="256" y="141" fill="#475569" font-size="12.5" text-anchor="middle">Entra</text><rect width="150" height="28" x="326" y="122" fill="#1e40af" stroke="#1e40af" rx="14"/><text x="401" y="141" fill="#fff" font-size="12.5" font-weight="700" text-anchor="middle">Agent 365</text><rect width="120" height="28" x="486" y="122" fill="#fff" stroke="#cbd5e1" rx="14"/><text x="546" y="141" fill="#475569" font-size="12.5" text-anchor="middle">Purview</text><rect width="120" height="28" x="616" y="122" fill="#fff" stroke="#cbd5e1" rx="14"/><text x="676" y="141" fill="#475569" font-size="12.5" text-anchor="middle">Defender</text><text x="1222" y="140" fill="#334155" font-size="12" font-style="italic" text-anchor="end">Governance &amp; security for the entire organization</text><rect width="470" height="336" x="40" y="176" fill="#fff" stroke="#cbd5e1" stroke-width="1.5" rx="14"/><rect width="470" height="38" x="40" y="176" fill="#fff7ed" rx="14"/><rect width="470" height="17" x="40" y="197" fill="#fff7ed"/><text x="60" y="200" fill="#b45309" font-size="13" font-weight="700">BEHIND THE DEMO TODAY</text><text x="60" y="244" fill="#0f172a" font-size="15" font-weight="700">One agent, done right</text><rect width="430" height="52" x="60" y="258" fill="#f6f9ff" stroke="#93b4f5" rx="9"/><text x="78" y="281" fill="#1d4ed8" font-size="13" font-weight="700">Its own identity</text><text x="78" y="299" fill="#475569" font-size="11.5">Entra / managed identity — not a shared account</text><rect width="430" height="52" x="60" y="318" fill="#f6f9ff" stroke="#93b4f5" rx="9"/><text x="78" y="341" fill="#1d4ed8" font-size="13" font-weight="700">Least-privilege reach</text><text x="78" y="359" fill="#475569" font-size="11.5">scoped read to exactly the data it needs</text><rect width="430" height="52" x="60" y="378" fill="#f6f9ff" stroke="#93b4f5" rx="9"/><text x="78" y="401" fill="#1d4ed8" font-size="13" font-weight="700">Human-in-the-loop</text><text x="78" y="419" fill="#475569" font-size="11.5">the agent briefs; the adjuster decides</text><rect width="430" height="60" x="60" y="440" fill="#eef2f7" stroke="#94a3b8" rx="10"/><text x="78" y="465" fill="#334155" font-size="12.5" font-weight="700">The scaling question</text><text x="78" y="486" fill="#475569" font-size="12">Doing that for a fleet across 6–8 domains needs a control plane.</text><line x1="516" x2="556" y1="344" y2="344" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/><text x="536" y="333" fill="#64748b" font-size="11" text-anchor="middle">scale</text><rect width="678" height="336" x="562" y="176" fill="#fff" stroke="#2563eb" stroke-width="2" rx="14"/><rect width="678" height="38" x="562" y="176" fill="#eff4ff" rx="14"/><rect width="678" height="17" x="562" y="197" fill="#eff4ff"/><text x="582" y="200" fill="#1d4ed8" font-size="13" font-weight="700">ONE CONTROL PLANE FOR EVERY AGENT</text><g><rect width="316" height="84" x="582" y="226" fill="#f6f9ff" stroke="#93b4f5" rx="10"/><text x="600" y="252" fill="#1d4ed8" font-size="14" font-weight="700">Registry / inventory</text><text x="600" y="274" fill="#475569" font-size="11.5">every agent known — no shadow</text><text x="600" y="292" fill="#475569" font-size="11.5">agents; one view of the fleet</text><rect width="316" height="84" x="910" y="226" fill="#f6f9ff" stroke="#93b4f5" rx="10"/><text x="928" y="252" fill="#1d4ed8" font-size="14" font-weight="700">Entra Agent ID</text><text x="928" y="274" fill="#475569" font-size="11.5">each agent a first-class identity —</text><text x="928" y="292" fill="#475569" font-size="11.5">whose authority is it acting on?</text><rect width="316" height="84" x="582" y="320" fill="#f6f9ff" stroke="#93b4f5" rx="10"/><text x="600" y="346" fill="#1d4ed8" font-size="14" font-weight="700">Least privilege &amp; access</text><text x="600" y="368" fill="#475569" font-size="11.5">scoped effective reach enforced</text><text x="600" y="386" fill="#475569" font-size="11.5">centrally, per agent</text><rect width="316" height="84" x="910" y="320" fill="#f6f9ff" stroke="#93b4f5" rx="10"/><text x="928" y="346" fill="#1d4ed8" font-size="14" font-weight="700">Lifecycle</text><text x="928" y="368" fill="#475569" font-size="11.5">onboard → certify → retire; kill</text><text x="928" y="386" fill="#475569" font-size="11.5">orphaned / stale agents</text><rect width="316" height="84" x="582" y="414" fill="#f6f9ff" stroke="#93b4f5" rx="10"/><text x="600" y="440" fill="#1d4ed8" font-size="14" font-weight="700">Monitoring &amp; posture</text><text x="600" y="462" fill="#475569" font-size="11.5">what is each agent doing, and is</text><text x="600" y="480" fill="#475569" font-size="11.5">it still behaving as approved?</text><rect width="316" height="84" x="910" y="414" fill="#fff7ed" stroke="#d97706" rx="10"/><text x="928" y="440" fill="#b45309" font-size="14" font-weight="700">Policy &amp; approval gates</text><text x="928" y="462" fill="#475569" font-size="11.5">human-in-the-loop enforced as a</text><text x="928" y="480" fill="#475569" font-size="11.5">fleet policy, not a per-build habit</text></g><rect width="1200" height="120" x="40" y="536" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.5" rx="12"/><text x="58" y="560" fill="#334155" font-size="13" font-weight="700">WHY IT MATTERS</text><rect width="382" height="66" x="58" y="572" fill="#fff" stroke="#cbd5e1" rx="9"/><text x="74" y="597" fill="#1d4ed8" font-size="13" font-weight="700">Governance that scales</text><text x="74" y="618" fill="#475569" font-size="11.5">one control plane as the estate grows from</text><text x="74" y="633" fill="#475569" font-size="11.5">a few agents to many across domains</text><rect width="382" height="66" x="452" y="572" fill="#fff" stroke="#cbd5e1" rx="9"/><text x="468" y="597" fill="#0d7a5f" font-size="13" font-weight="700">Identity you can attribute</text><text x="468" y="618" fill="#475569" font-size="11.5">every agent is identified, scoped, and</text><text x="468" y="633" fill="#475569" font-size="11.5">accountable for what it does</text><rect width="378" height="66" x="846" y="572" fill="#fff" stroke="#cbd5e1" rx="9"/><text x="862" y="597" fill="#6d28d9" font-size="13" font-weight="700">Enforced boundaries</text><text x="862" y="618" fill="#475569" font-size="11.5">one fleet-level point to enforce identity,</text><text x="862" y="633" fill="#475569" font-size="11.5">access, and policy</text></svg>