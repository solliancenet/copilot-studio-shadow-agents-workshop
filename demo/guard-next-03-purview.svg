<svg xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, system-ui, -apple-system, Arial, sans-serif" viewBox="0 0 1280 720"><defs><marker id="arr" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#64748b" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect width="1280" height="720" fill="#f7f9fc"/><text x="40" y="66" fill="#0f172a" font-size="26" font-weight="700">Microsoft Purview — visibility &amp; compliance across all data</text><text x="40" y="92" fill="#475569" font-size="15">The evidence layer the review committee runs on: labels and DLP on the data, plus a full audit trail of what agents did.</text><rect width="1200" height="52" x="40" y="110" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.5" rx="10"/><text x="58" y="131" fill="#64748b" font-size="10.5" font-weight="700">ORG-WIDE</text><text x="58" y="146" fill="#64748b" font-size="10.5" font-weight="700">GOVERNANCE</text><rect width="120" height="28" x="196" y="122" fill="#fff" stroke="#cbd5e1" rx="14"/><text x="256" y="141" fill="#475569" font-size="12.5" text-anchor="middle">Entra</text><rect width="150" height="28" x="326" y="122" fill="#fff" stroke="#cbd5e1" rx="14"/><text x="401" y="141" fill="#475569" font-size="12.5" text-anchor="middle">Agent 365</text><rect width="120" height="28" x="486" y="122" fill="#6d28d9" stroke="#6d28d9" rx="14"/><text x="546" y="141" fill="#fff" font-size="12.5" font-weight="700" text-anchor="middle">Purview</text><rect width="120" height="28" x="616" y="122" fill="#fff" stroke="#cbd5e1" rx="14"/><text x="676" y="141" fill="#475569" font-size="12.5" text-anchor="middle">Defender</text><text x="1222" y="140" fill="#334155" font-size="12" font-style="italic" text-anchor="end">Visibility &amp; compliance across all data</text><rect width="470" height="336" x="40" y="176" fill="#fff" stroke="#cbd5e1" stroke-width="1.5" rx="14"/><rect width="470" height="38" x="40" y="176" fill="#fff7ed" rx="14"/><rect width="470" height="17" x="40" y="197" fill="#fff7ed"/><text x="60" y="200" fill="#b45309" font-size="13" font-weight="700">BEHIND THE DEMO TODAY</text><text x="60" y="244" fill="#0f172a" font-size="15" font-weight="700">The audit trail is the money-shot</text><rect width="430" height="114" x="60" y="258" fill="#faf8ff" stroke="#a78bfa" rx="10"/><text x="78" y="283" fill="#6d28d9" font-size="13.5" font-weight="700">Collapsible audit trail (in-app)</text><text x="78" y="305" fill="#475569" font-size="11.5">every briefing shows what the agent read,</text><text x="78" y="323" fill="#475569" font-size="11.5">which sources it cited, and what it returned —</text><text x="78" y="341" fill="#475569" font-size="11.5">the human sees the basis before deciding.</text><text x="78" y="362" fill="#8b5cf6" font-size="11" font-style="italic">shown live in the Claims Triage console</text><rect width="430" height="48" x="60" y="382" fill="#f2fbf8" stroke="#5ec5a8" rx="9"/><text x="78" y="403" fill="#0f766e" font-size="13" font-weight="700">Least-privilege data reads</text><text x="78" y="420" fill="#475569" font-size="11.5">the agent only touches scoped claim/policy data</text><rect width="430" height="60" x="60" y="440" fill="#eef2f7" stroke="#94a3b8" rx="10"/><text x="78" y="465" fill="#334155" font-size="12.5" font-weight="700">The scaling question</text><text x="78" y="486" fill="#475569" font-size="12">A committee needs enterprise labels, DLP, and tenant-wide audit.</text><line x1="516" x2="556" y1="344" y2="344" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/><text x="536" y="333" fill="#64748b" font-size="11" text-anchor="middle">scale</text><rect width="678" height="336" x="562" y="176" fill="#fff" stroke="#6d28d9" stroke-width="2" rx="14"/><rect width="678" height="38" x="562" y="176" fill="#f5f0ff" rx="14"/><rect width="678" height="17" x="562" y="197" fill="#f5f0ff"/><text x="582" y="200" fill="#6d28d9" font-size="13" font-weight="700">ACROSS ALL DATA &amp; ALL AGENTS</text><g><rect width="316" height="82" x="582" y="226" fill="#faf8ff" stroke="#c4b5fd" rx="10"/><text x="600" y="252" fill="#6d28d9" font-size="14" font-weight="700">Sensitivity labels</text><text x="600" y="274" fill="#475569" font-size="11.5">classify claim / PII data; labels gate</text><text x="600" y="292" fill="#475569" font-size="11.5">what agents may ground on</text><rect width="316" height="82" x="910" y="226" fill="#faf8ff" stroke="#c4b5fd" rx="10"/><text x="928" y="252" fill="#6d28d9" font-size="14" font-weight="700">DLP for AI</text><text x="928" y="274" fill="#475569" font-size="11.5">block sensitive data leaving via agent</text><text x="928" y="292" fill="#475569" font-size="11.5">prompts, tools, or responses</text><rect width="316" height="82" x="582" y="318" fill="#faf8ff" stroke="#c4b5fd" rx="10"/><text x="600" y="344" fill="#6d28d9" font-size="14" font-weight="700">DSPM for AI</text><text x="600" y="366" fill="#475569" font-size="11.5">posture view: which agents touch which</text><text x="600" y="384" fill="#475569" font-size="11.5">sensitive data, and where risk is</text><rect width="316" height="82" x="910" y="318" fill="#faf8ff" stroke="#c4b5fd" rx="10"/><text x="928" y="344" fill="#6d28d9" font-size="14" font-weight="700">Audit &amp; eDiscovery</text><text x="928" y="366" fill="#475569" font-size="11.5">tenant-wide record of agent prompts,</text><text x="928" y="384" fill="#475569" font-size="11.5">responses, and actions — discoverable</text><rect width="644" height="88" x="582" y="410" fill="#f5f0ff" stroke="#a78bfa" rx="10"/><text x="600" y="436" fill="#6d28d9" font-size="14" font-weight="700">Comms Compliance &amp; Insider Risk · across every source</text><text x="600" y="459" fill="#475569" font-size="11.5">On-prem · Dataverse · M365 · Azure · Google Cloud · Amazon S3 — the regulatory / ethical</text><text x="600" y="477" fill="#475569" font-size="11.5">lens applied continuously to live agent activity, not just at intake.</text></g><rect width="1200" height="120" x="40" y="536" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.5" rx="12"/><text x="58" y="560" fill="#334155" font-size="13" font-weight="700">WHY IT MATTERS</text><rect width="382" height="66" x="58" y="572" fill="#fff" stroke="#cbd5e1" rx="9"/><text x="74" y="597" fill="#6d28d9" font-size="13" font-weight="700">Evidence for the committee</text><text x="74" y="618" fill="#475569" font-size="11.5">security, compliance, and legal get the</text><text x="74" y="633" fill="#475569" font-size="11.5">audit and posture they need to sign off</text><rect width="382" height="66" x="452" y="572" fill="#fff" stroke="#cbd5e1" rx="9"/><text x="468" y="597" fill="#0d7a5f" font-size="13" font-weight="700">Continuous risk visibility</text><text x="468" y="618" fill="#475569" font-size="11.5">labels, DLP, and DSPM watch live agent</text><text x="468" y="633" fill="#475569" font-size="11.5">activity, not just at intake</text><rect width="378" height="66" x="846" y="572" fill="#fff" stroke="#cbd5e1" rx="9"/><text x="862" y="597" fill="#1d4ed8" font-size="13" font-weight="700">Auditable oversight</text><text x="862" y="618" fill="#475569" font-size="11.5">every claim decision keeps a discoverable</text><text x="862" y="633" fill="#475569" font-size="11.5">record of the agent&apos;s contribution</text></svg>