<svg xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, system-ui, -apple-system, Arial, sans-serif" viewBox="0 0 1280 720"><defs><marker id="a" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#64748b" d="M0,0 L10,5 L0,10 z"/></marker><marker id="ao" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#d97706" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect width="1280" height="720" fill="#f7f9fc"/><text x="40" y="46" fill="#0f172a" font-size="26" font-weight="700">Solution Topology — Claims Triage Briefing</text><text x="40" y="72" fill="#475569" font-size="14">The Halcourt Mutual app calls an Azure AI Foundry agent; the agent reads claim data back through the app&apos;s own API.</text><rect width="150" height="110" x="40" y="250" fill="#e8f1fb" stroke="#4a90d9" rx="12"/><text x="115" y="298" fill="#1e3a5f" font-size="14" font-weight="700" text-anchor="middle">Adjuster /</text><text x="115" y="318" fill="#1e3a5f" font-size="14" font-weight="700" text-anchor="middle">claims pro</text><rect width="1026" height="404" x="214" y="150" fill="none" stroke="#94a3b8" stroke-dasharray="7 5" stroke-width="1.5" rx="16"/><text x="230" y="172" fill="#64748b" font-size="12" font-weight="700" letter-spacing=".5">AZURE — westus3 (deployed resources)</text><rect width="420" height="340" x="246" y="188" fill="#f2fbf8" stroke="#0d7a5f" stroke-width="2.5" rx="12"/><text x="266" y="214" fill="#0d7a5f" font-size="16" font-weight="700">Halcourt Mutual app</text><text x="266" y="233" fill="#475569" font-size="11">Azure Container App · .NET 8</text><rect width="380" height="92" x="266" y="248" fill="#fff" stroke="#5ec5a8" rx="9"/><text x="282" y="278" fill="#0f766e" font-size="14" font-weight="700">Portal UI</text><text x="282" y="299" fill="#475569" font-size="11">adjuster&apos;s workspace — shows the triage briefing</text><text x="282" y="318" fill="#475569" font-size="11">(MVC portal)</text><rect width="380" height="148" x="266" y="360" fill="#fff" stroke="#5ec5a8" rx="9"/><text x="282" y="388" fill="#0f766e" font-size="14" font-weight="700">REST API — claims &amp; policy data</text><text x="282" y="410" fill="#475569" font-size="11">GET policies · claims · premium-payments</text><text x="282" y="428" fill="#475569" font-size="11">POST claims (FNOL) · OpenAPI at /swagger</text><text x="282" y="450" fill="#475569" font-size="11">EF Core · SQLite (system of record)</text><rect width="440" height="340" x="760" y="188" fill="#f6f9ff" stroke="#1d4ed8" stroke-width="2.5" rx="12"/><text x="780" y="214" fill="#1d4ed8" font-size="16" font-weight="700">Azure AI Foundry</text><text x="780" y="233" fill="#475569" font-size="11">deployed resource</text><rect width="400" height="92" x="780" y="248" fill="#fff" stroke="#2563eb" rx="9"/><text x="796" y="276" fill="#1d4ed8" font-size="14" font-weight="700">Claims Triage agent</text><text x="796" y="297" fill="#475569" font-size="11">instructions · human-in-the-loop</text><text x="796" y="316" fill="#475569" font-size="11">briefs, never decides</text><rect width="190" height="136" x="780" y="372" fill="#eef4ff" stroke="#93b4f5" rx="9"/><text x="875" y="428" fill="#1e3a8a" font-size="13" font-weight="700" text-anchor="middle">Model deployment</text><text x="875" y="448" fill="#475569" font-size="10" text-anchor="middle">gpt-4.1 / gpt-5-class</text><rect width="190" height="136" x="990" y="372" fill="#eef4ff" stroke="#93b4f5" rx="9"/><text x="1085" y="422" fill="#1e3a8a" font-size="13" font-weight="700" text-anchor="middle">File Search</text><text x="1085" y="442" fill="#475569" font-size="10" text-anchor="middle">grounding docs:</text><text x="1085" y="458" fill="#475569" font-size="10" text-anchor="middle">declarations · claims guide</text><line x1="190" x2="244" y1="294" y2="294" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><text x="217" y="284" fill="#64748b" font-size="9" text-anchor="middle">uses</text><line x1="648" x2="778" y1="278" y2="278" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><text x="713" y="270" fill="#334155" font-size="10" font-weight="700" text-anchor="middle">1 · request briefing</text><line x1="778" x2="648" y1="302" y2="302" stroke="#64748b" stroke-dasharray="6 4" stroke-width="2" marker-end="url(#a)"/><text x="713" y="318" fill="#64748b" font-size="10" text-anchor="middle">3 · briefing returned (cited)</text><line x1="790" x2="650" y1="342" y2="405" stroke="#d97706" stroke-width="3" marker-end="url(#ao)"/><text x="716" y="378" fill="#b45309" font-size="10" font-weight="700" text-anchor="middle">2 · reads claim/policy data · OpenAPI tool</text><line x1="875" x2="875" y1="340" y2="371" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><text x="875" y="358" fill="#64748b" font-size="9" text-anchor="middle">inference</text><line x1="1085" x2="1085" y1="340" y2="371" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><text x="1085" y="358" fill="#64748b" font-size="9" text-anchor="middle">grounding</text><text x="40" y="590" fill="#475569" font-size="11.5"><tspan fill="#334155" font-weight="700">Governance:</tspan> agent identity (Entra) · least-privilege read scope · human-in-the-loop — the agent briefs, never decides.</text><text x="40" y="612" fill="#94a3b8" font-size="11.5">App live: ca-web-ieveiacpjsr6g…westus3.azurecontainerapps.io · deployed via azd (Bicep + ACR remote build). Foundry agent: to be provisioned.</text></svg>