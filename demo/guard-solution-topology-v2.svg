<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Segoe UI, system-ui, -apple-system, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#f7f9fc"/>

  <text x="40" y="46" font-size="26" font-weight="700" fill="#0f172a">Solution Topology — Claims Triage Briefing</text>
  <text x="40" y="72" font-size="14" fill="#475569">The Meridian Mutual app calls an Azure AI Foundry agent; the agent reads claim data back through the app's own API.</text>

  <!-- Adjuster -->
  <rect x="40" y="250" width="150" height="110" rx="12" fill="#e8f1fb" stroke="#4a90d9"/>
  <text x="115" y="298" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a5f">Adjuster /</text>
  <text x="115" y="318" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a5f">claims pro</text>

  <!-- Azure (deployed) enclosure -->
  <rect x="214" y="150" width="1026" height="404" rx="16" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="230" y="172" font-size="12" font-weight="700" fill="#64748b" letter-spacing="0.5">AZURE — westus3 (deployed resources)</text>

  <!-- Meridian Mutual app -->
  <rect x="246" y="188" width="420" height="340" rx="12" fill="#f2fbf8" stroke="#0d7a5f" stroke-width="2.5"/>
  <text x="266" y="214" font-size="16" font-weight="700" fill="#0d7a5f">Meridian Mutual app</text>
  <text x="266" y="233" font-size="11" fill="#475569">Azure Container App · .NET 8</text>

  <rect x="266" y="248" width="380" height="92" rx="9" fill="#ffffff" stroke="#5ec5a8"/>
  <text x="282" y="278" font-size="14" font-weight="700" fill="#0f766e">Portal UI</text>
  <text x="282" y="299" font-size="11" fill="#475569">adjuster's workspace — shows the triage briefing</text>
  <text x="282" y="318" font-size="11" fill="#475569">(MVC portal)</text>

  <rect x="266" y="360" width="380" height="148" rx="9" fill="#ffffff" stroke="#5ec5a8"/>
  <text x="282" y="388" font-size="14" font-weight="700" fill="#0f766e">REST API — claims &amp; policy data</text>
  <text x="282" y="410" font-size="11" fill="#475569">GET policies · claims · premium-payments</text>
  <text x="282" y="428" font-size="11" fill="#475569">POST claims (FNOL) · OpenAPI at /swagger</text>
  <text x="282" y="450" font-size="11" fill="#475569">EF Core · SQLite (system of record)</text>

  <!-- Azure AI Foundry -->
  <rect x="760" y="188" width="440" height="340" rx="12" fill="#f6f9ff" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="780" y="214" font-size="16" font-weight="700" fill="#1d4ed8">Azure AI Foundry</text>
  <text x="780" y="233" font-size="11" fill="#475569">deployed resource</text>

  <rect x="780" y="248" width="400" height="92" rx="9" fill="#ffffff" stroke="#2563eb"/>
  <text x="796" y="276" font-size="14" font-weight="700" fill="#1d4ed8">Claims Triage agent</text>
  <text x="796" y="297" font-size="11" fill="#475569">instructions · human-in-the-loop</text>
  <text x="796" y="316" font-size="11" fill="#475569">briefs, never decides</text>

  <rect x="780" y="372" width="190" height="136" rx="9" fill="#eef4ff" stroke="#93b4f5"/>
  <text x="875" y="428" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Model deployment</text>
  <text x="875" y="448" text-anchor="middle" font-size="10" fill="#475569">gpt-4.1 / gpt-5-class</text>

  <rect x="990" y="372" width="190" height="136" rx="9" fill="#eef4ff" stroke="#93b4f5"/>
  <text x="1085" y="422" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">File Search</text>
  <text x="1085" y="442" text-anchor="middle" font-size="10" fill="#475569">grounding docs:</text>
  <text x="1085" y="458" text-anchor="middle" font-size="10" fill="#475569">declarations · claims guide</text>

  <!-- Adjuster -> app -->
  <line x1="190" y1="294" x2="244" y2="294" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="217" y="284" text-anchor="middle" font-size="9" fill="#64748b">uses</text>

  <!-- app <-> agent (request / return) -->
  <line x1="648" y1="278" x2="778" y2="278" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="713" y="270" text-anchor="middle" font-size="10" font-weight="700" fill="#334155">1 · request briefing</text>
  <line x1="778" y1="302" x2="648" y2="302" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text x="713" y="318" text-anchor="middle" font-size="10" fill="#64748b">3 · briefing returned (cited)</text>

  <!-- agent -> app REST API (the key data edge) -->
  <line x1="790" y1="342" x2="650" y2="405" stroke="#d97706" stroke-width="3" marker-end="url(#ao)"/>
  <text x="716" y="378" text-anchor="middle" font-size="10" font-weight="700" fill="#b45309">2 · reads claim/policy data · OpenAPI tool</text>

  <!-- agent -> model / file search -->
  <line x1="875" y1="340" x2="875" y2="371" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <text x="875" y="358" text-anchor="middle" font-size="9" fill="#64748b">inference</text>
  <line x1="1085" y1="340" x2="1085" y2="371" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <text x="1085" y="358" text-anchor="middle" font-size="9" fill="#64748b">grounding</text>

  <!-- Footer -->
  <text x="40" y="590" font-size="11.5" fill="#475569"><tspan font-weight="700" fill="#334155">Governance:</tspan> agent identity (Entra) · least-privilege read scope · human-in-the-loop — the agent briefs, never decides.</text>
  <text x="40" y="612" font-size="11.5" fill="#94a3b8">App live: ca-web-ieveiacpjsr6g…westus3.azurecontainerapps.io · deployed via azd (Bicep + ACR remote build). Foundry agent: to be provisioned.</text>
</svg>
