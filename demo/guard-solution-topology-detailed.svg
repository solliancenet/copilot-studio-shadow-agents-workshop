  <text x="40" y="592" font-size="11.5" fill="#475569"><tspan font-weight="700" fill="#334155">Governance:</tspan> agent identity (Entra) · least-privilege read scope · human-in-the-loop — the agent briefs, never decides.</text>
  <text x="40" y="612" font-size="11.5" fill="#94a3b8">App live: ca-web-ieveiacpjsr6g…westus3.azurecontainerapps.io · deployed via azd (Bicep + ACR remote build). Foundry agent: to be provisioned.</text>
