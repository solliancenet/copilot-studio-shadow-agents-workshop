  <rect width="1280" height="720" fill="#f7f9fc"/>

  <text x="40" y="42" font-size="24" font-weight="700" fill="#0f172a">Solution Topology — Claims Triage (with infrastructure)</text>
  <text x="40" y="66" font-size="13.5" fill="#475569">The same request → read → return flow, plus the deployment plumbing: ACR, Log Analytics, managed identity, grounding store.</text>

  <!-- Adjuster -->
