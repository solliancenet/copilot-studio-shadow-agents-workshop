<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Segoe UI, system-ui, -apple-system, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#f7f9fc"/>

  <text x="40" y="48" font-size="27" font-weight="700" fill="#0f172a">Enterprise Agentic AI — Azure AI Foundry + Microsoft Fabric</text>
  <text x="40" y="76" font-size="15" fill="#475569">Orchestrated specialized agents over a governed data mesh — secure by design.</text>

  <!-- inter-band arrows -->
  <line x1="640" y1="156" x2="640" y2="169" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="640" y1="385" x2="640" y2="397" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="640" y1="525" x2="640" y2="537" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Band 1: Consumers -->
  <text x="40" y="114" font-size="12" font-weight="700" fill="#64748b" letter-spacing="1">CONSUMERS</text>
  <g font-size="13" fill="#1e3a5f">
    <rect x="180" y="122" width="210" height="32" rx="16" fill="#e8f1fb" stroke="#4a90d9"/>
    <text x="285" y="143" text-anchor="middle">Claims professionals</text>
    <rect x="405" y="122" width="200" height="32" rx="16" fill="#e8f1fb" stroke="#4a90d9"/>
    <text x="505" y="143" text-anchor="middle">Territory managers</text>
    <rect x="620" y="122" width="205" height="32" rx="16" fill="#e8f1fb" stroke="#4a90d9"/>
    <text x="722" y="143" text-anchor="middle">Domain data teams</text>
  </g>
  <text x="845" y="143" font-size="12" fill="#64748b" font-style="italic">via Microsoft Teams / M365 / apps</text>

  <!-- Band 2: Foundry orchestration (hero) -->
  <rect x="40" y="169" width="1200" height="216" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="60" y="200" font-size="18" font-weight="700" fill="#1d4ed8">Azure AI Foundry — Agent Orchestration Layer</text>
  <text x="60" y="221" font-size="12" fill="#64748b">An orchestrator plans and routes work to specialized agents.</text>

  <rect x="60" y="238" width="140" height="122" rx="10" fill="#1e40af"/>
  <text x="130" y="295" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Orchestrator</text>
  <text x="130" y="315" text-anchor="middle" font-size="11" fill="#cfe0ff">plan · route</text>

  <text x="225" y="252" font-size="11" font-weight="700" fill="#64748b">Business agents</text>
  <rect x="225" y="258" width="205" height="48" rx="8" fill="#fff4e6" stroke="#d97706" stroke-width="2"/>
  <text x="236" y="280" font-size="13" font-weight="700" fill="#b45309">Claims Triage Briefing</text>
  <text x="236" y="297" font-size="10" font-weight="700" fill="#b45309">▶ Wednesday demo</text>
  <rect x="445" y="258" width="190" height="48" rx="8" fill="#eef4ff" stroke="#93b4f5"/>
  <text x="455" y="286" font-size="13" fill="#1e3a8a">Territory Mgr Briefing</text>

  <text x="225" y="326" font-size="11" font-weight="700" fill="#64748b">Engineering-role agents</text>
  <g font-size="12.5" fill="#1e3a8a">
    <rect x="225" y="332" width="170" height="44" rx="8" fill="#eef4ff" stroke="#93b4f5"/>
    <text x="310" y="359" text-anchor="middle">Data / BI Engineer</text>
    <rect x="405" y="332" width="140" height="44" rx="8" fill="#eef4ff" stroke="#93b4f5"/>
    <text x="475" y="359" text-anchor="middle">Data Modeler</text>
    <rect x="555" y="332" width="175" height="44" rx="8" fill="#eef4ff" stroke="#93b4f5"/>
    <text x="642" y="359" text-anchor="middle">Analytics Engineer</text>
  </g>

  <g font-size="12.5" fill="#475569">
    <text x="770" y="266">Foundry orchestrates specialized</text>
    <text x="770" y="286">agents across the data-product</text>
    <text x="770" y="306">lifecycle — design → build → test →</text>
    <text x="770" y="326">deploy → support — coordinating</text>
    <text x="770" y="346">with Fabric Data Agents &amp; platform</text>
    <text x="770" y="366">services, scaling to 6–8 domains.</text>
  </g>

  <!-- Band 3: Data & tools plane -->
  <rect x="40" y="397" width="470" height="128" rx="12" fill="#e6f7f1" stroke="#5ec5a8"/>
  <text x="58" y="421" font-size="16" font-weight="700" fill="#0d7a5f">Microsoft Fabric</text>
  <g font-size="13" fill="#334155">
    <text x="58" y="448">Fabric Data Agents</text>
    <text x="58" y="470">OneLake · Lakehouse</text>
    <text x="58" y="492">Semantic models</text>
    <text x="58" y="514">Data products — 6–8 Data Mesh domains</text>
  </g>

  <rect x="525" y="397" width="290" height="128" rx="12" fill="#eef4ff" stroke="#93b4f5"/>
  <text x="543" y="421" font-size="16" font-weight="700" fill="#1d4ed8">Microsoft 365</text>
  <g font-size="13" fill="#334155">
    <text x="543" y="450">SharePoint</text>
    <text x="543" y="474">Outlook / email</text>
    <text x="543" y="498">Teams</text>
  </g>

  <rect x="830" y="397" width="410" height="128" rx="12" fill="#f3f0fc" stroke="#a78bfa"/>
  <text x="848" y="421" font-size="16" font-weight="700" fill="#6d28d9">Systems of record</text>
  <text x="848" y="449" font-size="13" fill="#334155">IIS — Insurance Information System (FNOL)</text>
  <rect x="846" y="461" width="388" height="28" rx="6" fill="#fff4e6" stroke="#d97706"/>
  <text x="856" y="480" font-size="12.5" font-weight="700" fill="#b45309">Claims &amp; Policy API — Meridian Mutual (demo)</text>
  <text x="848" y="510" font-size="13" fill="#334155">Line-of-business data</text>

  <!-- Band 4: Governance & security foundation -->
  <rect x="40" y="537" width="1200" height="123" rx="12" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/>
  <text x="56" y="561" font-size="14" font-weight="700" fill="#334155">GOVERNANCE &amp; SECURITY FOUNDATION</text>
  <text x="372" y="561" font-size="12" fill="#64748b">— where Solliance leads · underpins every agent, tool, and data access above</text>

  <g>
    <rect x="56" y="575" width="224" height="72" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="70" y="602" font-size="14" font-weight="700" fill="#1d4ed8">Agent identity</text>
    <text x="70" y="624" font-size="11.5" fill="#475569">Entra Agent ID per agent</text>

    <rect x="292" y="575" width="224" height="72" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="306" y="602" font-size="14" font-weight="700" fill="#0d7a5f">Least-privilege access</text>
    <text x="306" y="624" font-size="11.5" fill="#475569">scoped effective reach</text>

    <rect x="528" y="575" width="224" height="72" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="542" y="602" font-size="14" font-weight="700" fill="#b45309">Human-in-the-loop</text>
    <text x="542" y="624" font-size="11.5" fill="#475569">no autonomous decisions</text>

    <rect x="764" y="575" width="224" height="72" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="778" y="602" font-size="14" font-weight="700" fill="#6d28d9">Data controls</text>
    <text x="778" y="624" font-size="11.5" fill="#475569">Purview · DLP</text>

    <rect x="1000" y="575" width="224" height="72" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="1014" y="602" font-size="14" font-weight="700" fill="#0369a1">Observability &amp; audit</text>
    <text x="1014" y="624" font-size="11.5" fill="#475569">tracing · full audit trail</text>
  </g>

  <text x="40" y="690" font-size="12" fill="#94a3b8">Wednesday demo: the highlighted Claims Triage Briefing agent, backed by the Meridian Mutual Claims &amp; Policy API — human stays in the loop.</text>
</svg>
