<svg xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, system-ui, -apple-system, Arial, sans-serif" viewBox="0 0 1280 720"><defs><marker id="arr" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#64748b" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect width="1280" height="720" fill="#f7f9fc"/><text x="40" y="48" fill="#0f172a" font-size="27" font-weight="700">Enterprise Agentic AI — Azure AI Foundry + Microsoft Fabric</text><text x="40" y="76" fill="#475569" font-size="15">Orchestrated specialized agents over a governed data mesh — secure by design.</text><line x1="640" x2="640" y1="156" y2="169" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/><line x1="640" x2="640" y1="385" y2="397" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/><line x1="640" x2="640" y1="525" y2="537" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/><text x="40" y="114" fill="#64748b" font-size="12" font-weight="700" letter-spacing="1">CONSUMERS</text><g fill="#1e3a5f" font-size="13"><rect width="210" height="32" x="180" y="122" fill="#e8f1fb" stroke="#4a90d9" rx="16"/><text x="285" y="143" text-anchor="middle">Claims professionals</text><rect width="200" height="32" x="405" y="122" fill="#e8f1fb" stroke="#4a90d9" rx="16"/><text x="505" y="143" text-anchor="middle">Territory managers</text><rect width="205" height="32" x="620" y="122" fill="#e8f1fb" stroke="#4a90d9" rx="16"/><text x="722" y="143" text-anchor="middle">Domain data teams</text></g><text x="845" y="143" fill="#64748b" font-size="12" font-style="italic">via Microsoft Teams / M365 / apps</text><rect width="1200" height="216" x="40" y="169" fill="#fff" stroke="#2563eb" stroke-width="2.5" rx="14"/><text x="60" y="200" fill="#1d4ed8" font-size="18" font-weight="700">Azure AI Foundry — Agent Orchestration Layer</text><text x="60" y="221" fill="#64748b" font-size="12">An orchestrator plans and routes work to specialized agents.</text><rect width="140" height="122" x="60" y="238" fill="#1e40af" rx="10"/><text x="130" y="295" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">Orchestrator</text><text x="130" y="315" fill="#cfe0ff" font-size="11" text-anchor="middle">plan · route</text><text x="225" y="252" fill="#64748b" font-size="11" font-weight="700">Business agents</text><rect width="205" height="48" x="225" y="258" fill="#fff4e6" stroke="#d97706" stroke-width="2" rx="8"/><text x="236" y="280" fill="#b45309" font-size="13" font-weight="700">Claims Triage Briefing</text><text x="236" y="297" fill="#b45309" font-size="10" font-weight="700">▶ Wednesday demo</text><rect width="190" height="48" x="445" y="258" fill="#eef4ff" stroke="#93b4f5" rx="8"/><text x="455" y="286" fill="#1e3a8a" font-size="13">Territory Mgr Briefing</text><text x="225" y="326" fill="#64748b" font-size="11" font-weight="700">Engineering-role agents</text><g fill="#1e3a8a" font-size="12.5"><rect width="170" height="44" x="225" y="332" fill="#eef4ff" stroke="#93b4f5" rx="8"/><text x="310" y="359" text-anchor="middle">Data / BI Engineer</text><rect width="140" height="44" x="405" y="332" fill="#eef4ff" stroke="#93b4f5" rx="8"/><text x="475" y="359" text-anchor="middle">Data Modeler</text><rect width="175" height="44" x="555" y="332" fill="#eef4ff" stroke="#93b4f5" rx="8"/><text x="642" y="359" text-anchor="middle">Analytics Engineer</text></g><g fill="#475569" font-size="12.5"><text x="770" y="266">Foundry orchestrates specialized</text><text x="770" y="286">agents across the data-product</text><text x="770" y="306">lifecycle — design → build → test →</text><text x="770" y="326">deploy → support — coordinating</text><text x="770" y="346">with Fabric Data Agents &amp; platform</text><text x="770" y="366">services, scaling to 6–8 domains.</text></g><rect width="470" height="128" x="40" y="397" fill="#e6f7f1" stroke="#5ec5a8" rx="12"/><text x="58" y="421" fill="#0d7a5f" font-size="16" font-weight="700">Microsoft Fabric</text><g fill="#334155" font-size="13"><text x="58" y="448">Fabric Data Agents</text><text x="58" y="470">OneLake · Lakehouse</text><text x="58" y="492">Semantic models</text><text x="58" y="514">Data products — 6–8 Data Mesh domains</text></g><rect width="290" height="128" x="525" y="397" fill="#eef4ff" stroke="#93b4f5" rx="12"/><text x="543" y="421" fill="#1d4ed8" font-size="16" font-weight="700">Microsoft 365</text><g fill="#334155" font-size="13"><text x="543" y="450">SharePoint</text><text x="543" y="474">Outlook / email</text><text x="543" y="498">Teams</text></g><rect width="410" height="128" x="830" y="397" fill="#f3f0fc" stroke="#a78bfa" rx="12"/><text x="848" y="421" fill="#6d28d9" font-size="16" font-weight="700">Systems of record</text><text x="848" y="449" fill="#334155" font-size="13">IIS — Insurance Information System (FNOL)</text><rect width="388" height="28" x="846" y="461" fill="#fff4e6" stroke="#d97706" rx="6"/><text x="856" y="480" fill="#b45309" font-size="12.5" font-weight="700">Claims &amp; Policy API — Halcourt Mutual (demo)</text><text x="848" y="510" fill="#334155" font-size="13">Line-of-business data</text><rect width="1200" height="123" x="40" y="537" fill="#eef2f7" stroke="#94a3b8" stroke-width="2" rx="12"/><text x="56" y="561" fill="#334155" font-size="14" font-weight="700">GOVERNANCE &amp; SECURITY FOUNDATION</text><text x="372" y="561" fill="#64748b" font-size="12">— where Solliance leads · underpins every agent, tool, and data access above</text><g><rect width="224" height="72" x="56" y="575" fill="#fff" stroke="#cbd5e1" rx="9"/><text x="70" y="602" fill="#1d4ed8" font-size="14" font-weight="700">Agent identity</text><text x="70" y="624" fill="#475569" font-size="11.5">Entra Agent ID per agent</text><rect width="224" height="72" x="292" y="575" fill="#fff" stroke="#cbd5e1" rx="9"/><text x="306" y="602" fill="#0d7a5f" font-size="14" font-weight="700">Least-privilege access</text><text x="306" y="624" fill="#475569" font-size="11.5">scoped effective reach</text><rect width="224" height="72" x="528" y="575" fill="#fff" stroke="#cbd5e1" rx="9"/><text x="542" y="602" fill="#b45309" font-size="14" font-weight="700">Human-in-the-loop</text><text x="542" y="624" fill="#475569" font-size="11.5">no autonomous decisions</text><rect width="224" height="72" x="764" y="575" fill="#fff" stroke="#cbd5e1" rx="9"/><text x="778" y="602" fill="#6d28d9" font-size="14" font-weight="700">Data controls</text><text x="778" y="624" fill="#475569" font-size="11.5">Purview · DLP</text><rect width="224" height="72" x="1000" y="575" fill="#fff" stroke="#cbd5e1" rx="9"/><text x="1014" y="602" fill="#0369a1" font-size="14" font-weight="700">Observability &amp; audit</text><text x="1014" y="624" fill="#475569" font-size="11.5">tracing · full audit trail</text></g><text x="40" y="690" fill="#94a3b8" font-size="12">Wednesday demo: the highlighted Claims Triage Briefing agent, backed by the Halcourt Mutual Claims &amp; Policy API — human stays in the loop.</text></svg>